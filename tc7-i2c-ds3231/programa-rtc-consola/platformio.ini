; TC07 - RTC DS3231 por I2C, manejado desde el Monitor. ESP-IDF 5.5.0, no Arduino.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; monitor_echo: ves lo que tecleas; monitor_eol: Enter envia '\n'
monitor_echo = yes
monitor_eol = LF
monitor_filters = direct
