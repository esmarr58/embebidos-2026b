; TC06 - Chat por UART2 entre dos ESP32-S3. ESP-IDF 5.5.0, no Arduino.
; El mismo firmware se sube a las DOS tarjetas.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; Ajustes para chatear comodo desde "pio device monitor":
; - monitor_echo: ves lo que tecleas (la tarjeta no hace eco de teclas)
; - monitor_eol: Enter envia '\n', que el firmware toma como fin de linea
; - monitor_filters: salida sin transformar; el CR+LF lo pone el firmware
monitor_echo = yes
monitor_eol = LF
monitor_filters = direct
