; Configuracion de referencia para la Practica 3 (contador optico 0-9).
; En clase NO crees un proyecto nuevo: reutiliza tu proyecto base ya
; descargado y solo reemplaza src/main.c por el archivo de la version que
; quieras probar (main_digital.c o main_adc.c). Este .ini es solo referencia.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
